name: Build, push and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Push to Docker Hub and deploy to AWS
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1

jobs:
  validate:
    name: Validate deployment artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          build-args: COMMIT_SHA=${{ github.sha }}
          tags: student-api:${{ github.sha }}

  build-and-push:
    name: Push immutable and latest tags
    needs: validate
    if: github.event_name == 'workflow_dispatch' && inputs.deploy == true
    runs-on: ubuntu-latest
    steps:
      - name: Check required deployment secrets
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
          ASG_NAME: ${{ secrets.ASG_NAME }}
          ALB_DNS_NAME: ${{ secrets.ALB_DNS_NAME }}
        run: |
          set -euo pipefail
          missing=()
          for name in DOCKERHUB_USERNAME DOCKERHUB_TOKEN MONGODB_URI AWS_ROLE_ARN ASG_NAME ALB_DNS_NAME; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required GitHub Actions secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: COMMIT_SHA=${{ github.sha }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/student-api:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/student-api:latest

  deploy:
    name: Deploy through AWS Systems Manager
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync MongoDB URI to Parameter Store
        shell: bash
        run: |
          aws ssm put-parameter \
            --name /student-api/mongodb/uri \
            --value "${{ secrets.MONGODB_URI }}" \
            --type SecureString \
            --overwrite

      - name: Deploy the immutable image to every InService instance
        shell: bash
        env:
          ASG_NAME: ${{ secrets.ASG_NAME }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail
          IMAGE="${DOCKERHUB_USERNAME}/student-api:${GITHUB_SHA}"
          INSTANCE_IDS=$(aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names "$ASG_NAME" \
            --query 'AutoScalingGroups[0].Instances[?LifecycleState==`InService`].InstanceId' \
            --output text)

          if [[ -z "$INSTANCE_IDS" || "$INSTANCE_IDS" == "None" ]]; then
            echo "No InService instances found in $ASG_NAME" >&2
            exit 1
          fi

          jq -n --arg image "$IMAGE" --arg region "$AWS_REGION" '{commands: [
            "set -e",
            "for i in $(seq 1 30); do /usr/local/bin/aws --version >/dev/null 2>&1 && break; echo Waiting_for_AWS_CLI_$i/30; sleep 10; done",
            "export PATH=$PATH:/usr/local/bin",
            "for i in $(seq 1 30); do docker info >/dev/null 2>&1 && break; echo Waiting_for_Docker_$i/30; sleep 10; done",
            ("DH_USER=$(/usr/local/bin/aws ssm get-parameter --region " + $region + " --name /student-api/dockerhub/username --query Parameter.Value --output text)"),
            ("DH_TOKEN=$(/usr/local/bin/aws ssm get-parameter --region " + $region + " --name /student-api/dockerhub/token --with-decryption --query Parameter.Value --output text)"),
            ("MONGO_URI=$(/usr/local/bin/aws ssm get-parameter --region " + $region + " --name /student-api/mongodb/uri --with-decryption --query Parameter.Value --output text)"),
            "echo $DH_TOKEN | docker login --username $DH_USER --password-stdin",
            ("docker pull " + $image),
            "docker rm -f student-api 2>/dev/null || true",
            ("docker run -d --name student-api --restart unless-stopped -p 3000:3000 -e COMMIT_SHA=" + env.GITHUB_SHA + " -e MONGODB_URI=$MONGO_URI " + $image)
          ]}' > ssm-params.json

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids $INSTANCE_IDS \
            --document-name AWS-RunShellScript \
            --comment "Deploy student-api ${GITHUB_SHA}" \
            --parameters file://ssm-params.json \
            --query Command.CommandId \
            --output text)

          for INSTANCE_ID in $INSTANCE_IDS; do
            aws ssm wait command-executed \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID"
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}'
          done

      - name: Verify ALB health and deployed commit
        shell: bash
        env:
          ALB_DNS_NAME: ${{ secrets.ALB_DNS_NAME }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            HEALTH=$(curl --fail --silent --show-error "http://${ALB_DNS_NAME}/health" || true)
            VERSION=$(curl --fail --silent --show-error "http://${ALB_DNS_NAME}/version" || true)
            if jq -e '.status == "ok" and .db == "connected"' <<<"$HEALTH" >/dev/null \
              && jq -e --arg sha "$GITHUB_SHA" '.commit == $sha' <<<"$VERSION" >/dev/null; then
              echo "Healthy at http://${ALB_DNS_NAME}"
              exit 0
            fi
            echo "Waiting for ALB target health ($attempt/30)"
            sleep 10
          done
          echo "Deployment did not become healthy" >&2
          exit 1
